<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Oakridge Legal Partners website concept</title>
  <desc id="desc">A polished business law homepage concept with charcoal and forest green palette, plain-language counsel positioning, and a consultation CTA.</desc>
  <rect width="1200" height="675" fill="#e8ece9"/>
  <rect x="0" y="0" width="1200" height="80" fill="#1b2420"/>
  <circle cx="72" cy="40" r="18" fill="#3d5c4a"/>
  <text x="108" y="49" font-family="Georgia" font-weight="700" font-size="24" fill="#f2f5f3">Oakridge Legal Partners</text>
  <text x="680" y="48" font-family="Arial" font-size="17" fill="#c9d4cc">Services   Matters   Process   Contact</text>
  <rect x="1010" y="20" rx="4" width="150" height="42" fill="#3d5c4a"/>
  <text x="1032" y="47" font-family="Arial" font-weight="700" font-size="14" fill="#fff">Contact the firm</text>
  <rect x="70" y="130" width="520" height="460" rx="4" fill="#1b2420"/>
  <rect x="70" y="130" width="8" height="460" fill="#3d5c4a"/>
  <text x="110" y="200" font-family="Arial" font-weight="700" font-size="14" fill="#8fa896" letter-spacing="2">BUSINESS LAW CONCEPT</text>
  <text x="110" y="270" font-family="Georgia" font-weight="700" font-size="44" fill="#f2f5f3">Counsel you can</text>
  <text x="110" y="328" font-family="Georgia" font-weight="700" font-size="44" fill="#f2f5f3">take to the board.</text>
  <text x="110" y="385" font-family="Arial" font-size="19" fill="#c9d4cc">Plain-language options, risks, and next steps</text>
  <text x="110" y="415" font-family="Arial" font-size="19" fill="#c9d4cc">for owners who need decisions they can defend.</text>
  <rect x="110" y="470" rx="4" width="230" height="50" fill="#3d5c4a"/>
  <text x="138" y="502" font-family="Arial" font-weight="700" font-size="16" fill="#fff">Request a consultation</text>
  <rect x="360" y="470" rx="4" width="160" height="50" fill="none" stroke="#8fa896" stroke-width="2"/>
  <text x="390" y="502" font-family="Arial" font-weight="700" font-size="16" fill="#f2f5f3">View services</text>
  <g transform="translate(650 150)">
    <rect width="480" height="420" rx="4" fill="#f2f5f3"/>
    <text x="36" y="55" font-family="Arial" font-weight="700" font-size="14" fill="#3d5c4a">PRACTICE PATHS</text>
    <rect x="36" y="80" width="408" height="130" rx="6" fill="#fff" stroke="#c5cdc7"/>
    <text x="56" y="125" font-family="Georgia" font-weight="700" font-size="24" fill="#1b2420">Corporate</text>
    <text x="56" y="160" font-family="Arial" font-size="16" fill="#5c6b62">Transactions, governance, agreements</text>
    <rect x="36" y="230" width="408" height="130" rx="6" fill="#fff" stroke="#c5cdc7"/>
    <text x="56" y="275" font-family="Georgia" font-weight="700" font-size="24" fill="#1b2420">Disputes</text>
    <text x="56" y="310" font-family="Arial" font-size="16" fill="#5c6b62">Clear strategy when stakes rise</text>
    <text x="36" y="400" font-family="Arial" font-size="14" fill="#5c6b62">Illustrative practice areas  not a real firm</text>
  </g>
</svg>
