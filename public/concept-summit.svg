<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Summit Industrial Systems website concept</title>
  <desc id="desc">A polished manufacturing and automation homepage concept with deep slate and amber accent, capability clarity, and a production challenge CTA.</desc>
  <rect width="1200" height="675" fill="#12171c"/>
  <rect x="0" y="0" width="1200" height="82" fill="#0c1014"/>
  <rect x="55" y="24" width="34" height="34" rx="3" fill="#c47a2a"/>
  <text x="106" y="50" font-family="Arial" font-weight="800" font-size="23" fill="#f1f3f4">SUMMIT INDUSTRIAL SYSTEMS</text>
  <text x="700" y="49" font-family="Arial" font-size="16" fill="#c5cbd0">Services   Work   Process   Contact</text>
  <rect x="1015" y="20" rx="4" width="145" height="44" fill="#c47a2a"/>
  <text x="1036" y="48" font-family="Arial" font-weight="800" font-size="13" fill="#12171c">Contact team</text>
  <path d="M0 500L500 280 780 340 1200 200V675H0Z" fill="#1e252c"/>
  <path d="M0 580L420 400 700 450 1200 300V675H0Z" fill="#3a4248" opacity=".7"/>
  <rect x="900" y="140" width="180" height="8" fill="#c47a2a" opacity=".8"/>
  <rect x="960" y="160" width="120" height="8" fill="#c47a2a" opacity=".45"/>
  <rect x="1020" y="180" width="60" height="8" fill="#c47a2a" opacity=".25"/>
  <text x="65" y="175" font-family="Arial" font-weight="800" font-size="14" fill="#c47a2a" letter-spacing="2">MANUFACTURING &amp; AUTOMATION CONCEPT</text>
  <text x="65" y="250" font-family="Arial" font-weight="900" font-size="48" fill="#f1f3f4">Automation that</text>
  <text x="65" y="312" font-family="Arial" font-weight="900" font-size="48" fill="#f1f3f4">operations can evaluate.</text>
  <text x="65" y="375" font-family="Arial" font-size="20" fill="#c5cbd0">Clear capability paths for plant leaders who need</text>
  <text x="65" y="407" font-family="Arial" font-size="20" fill="#c5cbd0">a next step  not another vague brochure.</text>
  <rect x="65" y="455" rx="4" width="290" height="54" fill="#c47a2a"/>
  <text x="88" y="489" font-family="Arial" font-weight="800" font-size="15" fill="#12171c">Discuss a production challenge</text>
  <rect x="375" y="455" rx="4" width="150" height="54" fill="none" stroke="#8a939b" stroke-width="2"/>
  <text x="408" y="489" font-family="Arial" font-weight="700" font-size="15" fill="#f1f3f4">View work</text>
  <g transform="translate(780 360)">
    <rect width="350" height="200" rx="8" fill="#f1f3f4"/>
    <text x="24" y="40" font-family="Arial" font-weight="800" font-size="14" fill="#12171c">CAPABILITY PATHS</text>
    <rect x="24" y="58" width="6" height="50" fill="#c47a2a"/>
    <text x="44" y="80" font-family="Arial" font-weight="700" font-size="17" fill="#12171c">Automation systems</text>
    <text x="44" y="104" font-family="Arial" font-size="14" fill="#5c656c">Cells operators can evaluate</text>
    <rect x="24" y="130" width="6" height="50" fill="#c47a2a"/>
    <text x="44" y="152" font-family="Arial" font-weight="700" font-size="17" fill="#12171c">Production equipment</text>
    <text x="44" y="176" font-family="Arial" font-size="14" fill="#5c656c">Equipment with a clear next step</text>
  </g>
