<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ROALLA retail technology categories</title>
  <desc id="desc">ROALLA connects five retail outcomes: Attract and Convert, Capture and Respond, Sell and Fulfill, Connect Teams and Locations, and Protect and Improve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#0b2630"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123546"/><stop offset="1" stop-color="#0b2230"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#00b4c5" stop-opacity=".25"/><stop offset="1" stop-color="#00b4c5" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".36"/></filter>
    <style>
      .connector{fill:none;stroke:#39d5df;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 14;opacity:.58;animation:flow 6s linear infinite}
      .node{fill:#d4af37;filter:url(#shadow);animation:pulse 2.8s ease-in-out infinite}
      .panel{fill:url(#panel);stroke:#3bd1dc;stroke-opacity:.36;stroke-width:2;filter:url(#shadow);animation:drift 5s ease-in-out infinite}
      .p2{animation-delay:-1s}.p3{animation-delay:-2s}.p4{animation-delay:-3s}.p5{animation-delay:-4s}
      .kicker{fill:#7be6ec;font:700 18px Arial,sans-serif;letter-spacing:2px}
      .label{fill:#fff;font:700 29px Georgia,serif}
      .detail{fill:#bdcbd3;font:400 18px Arial,sans-serif}
      @keyframes flow{to{stroke-dashoffset:-96}}
      @keyframes pulse{50%{opacity:.48;transform:scale(.84);transform-origin:center}}
      @keyframes drift{50%{transform:translateY(-7px)}}
      @media (prefers-reduced-motion:reduce){.connector,.node,.panel{animation:none}}
    </style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="720" cy="450" r="295" fill="url(#halo)"/>
  <g aria-hidden="true">
    <path class="connector" d="M590 386 451 280M850 386l139-106M572 474 414 530M868 474l158 56M720 574v100"/>
    <circle class="node" cx="451" cy="280" r="7"/><circle class="node" cx="989" cy="280" r="7"/><circle class="node" cx="414" cy="530" r="7"/><circle class="node" cx="1026" cy="530" r="7"/><circle class="node" cx="720" cy="674" r="7"/>
  </g>
  <g class="panel p1">
    <rect x="70" y="105" width="420" height="175" rx="24"/>
    <text x="106" y="148" class="kicker">01 · GROW</text><text x="106" y="192" class="label">Attract &amp; Convert</text>
    <text x="106" y="229" class="detail"><tspan x="106">Visibility, campaigns, commerce,</tspan><tspan x="106" dy="26">and conversion paths</tspan></text>
  </g>
  <g class="panel p2">
    <rect x="950" y="105" width="420" height="175" rx="24"/>
    <text x="986" y="148" class="kicker">02 · RESPOND</text><text x="986" y="192" class="label">Capture &amp; Respond</text>
    <text x="986" y="229" class="detail"><tspan x="986">Calls, messages, inquiries,</tspan><tspan x="986" dy="26">bookings, and follow-up</tspan></text>
  </g>
  <g class="panel p3">
    <rect x="35" y="510" width="420" height="175" rx="24"/>
    <text x="71" y="553" class="kicker">03 · TRANSACT</text><text x="71" y="597" class="label">Sell &amp; Fulfill</text>
    <text x="71" y="634" class="detail"><tspan x="71">POS, inventory, orders, payments,</tspan><tspan x="71" dy="26">and delivery workflows</tspan></text>
  </g>
  <g class="panel p4">
    <rect x="985" y="510" width="420" height="175" rx="24"/>
    <text x="1021" y="553" class="kicker">04 · CONNECT</text><text x="1021" y="594" class="label"><tspan x="1021">Connect Teams</tspan><tspan x="1021" dy="34">&amp; Locations</tspan></text>
    <text x="1021" y="662" class="detail">Calling, collaboration, connectivity</text>
  </g>
  <g class="panel p5">
    <rect x="510" y="680" width="420" height="175" rx="24"/>
    <text x="546" y="723" class="kicker">05 · STRENGTHEN</text><text x="546" y="767" class="label">Protect &amp; Improve</text>
    <text x="546" y="804" class="detail"><tspan x="546">Security, continuity, analytics,</tspan><tspan x="546" dy="26">governance, and improvement</tspan></text>
  </g>
  <g filter="url(#shadow)">
    <circle cx="720" cy="450" r="142" fill="#071722" stroke="#d4af37" stroke-width="3"/>
    <circle cx="720" cy="450" r="126" fill="none" stroke="#00b4c5" stroke-opacity=".32" stroke-width="2"/>
    <!-- Exact geometry from the official /roalla-logo-2027.svg mark. -->
    <g fill="#00B4C5" transform="translate(635 346) scale(.17)">
      <path d="M454 222 86 116l24 58h32v46h32l80 306 174-83z"/><path d="m546 222 368-106-24 58h-32v46h-32l-80 306-174-83z"/><path d="m428 478-168 82 119 196 89-211z"/><path d="m572 478 168 82-119 196-89-211z"/><path d="M500 188 698 756h-92L500 449 394 756h-92z"/>
    </g>
    <text x="720" y="557" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">ROALLA</text>
  </g>
</svg>
