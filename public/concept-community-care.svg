<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Community care website concept</title><desc id="desc">A polished healthcare service homepage concept with booking and accessibility information.</desc>
  <rect width="1200" height="675" fill="#f4fbfa"/><rect x="0" y="0" width="1200" height="80" fill="#fff"/><circle cx="72" cy="40" r="22" fill="#0f766e"/><text x="110" y="49" font-family="Arial" font-weight="700" font-size="25" fill="#15333a">Harbour Community Care</text><text x="760" y="47" font-family="Arial" font-size="18" fill="#456">Services   Team   Resources   Contact</text><rect x="1015" y="20" rx="10" width="150" height="42" fill="#0f766e"/><text x="1044" y="47" font-family="Arial" font-weight="700" font-size="16" fill="#fff">Book a visit</text>
  <rect x="70" y="135" rx="18" width="590" height="430" fill="#dcefeb"/><circle cx="500" cy="315" r="145" fill="#9ecfc5"/><path d="M390 470c30-125 190-125 220 0" fill="#fff" opacity=".8"/><circle cx="500" cy="285" r="72" fill="#fff" opacity=".8"/>
  <text x="720" y="185" font-family="Arial" font-weight="700" font-size="18" fill="#0f766e">CARE THAT FITS YOUR COMMUNITY</text><text x="720" y="245" font-family="Georgia" font-weight="700" font-size="48" fill="#15333a">Find the right care.</text><text x="720" y="300" font-family="Georgia" font-weight="700" font-size="48" fill="#15333a">Book with confidence.</text><text x="720" y="355" font-family="Arial" font-size="21" fill="#456">Accessible services, clear eligibility,</text><text x="720" y="386" font-family="Arial" font-size="21" fill="#456">and simple online booking.</text><rect x="720" y="430" rx="10" width="190" height="52" fill="#0f766e"/><text x="750" y="463" font-family="Arial" font-weight="700" font-size="17" fill="#fff">Explore services</text><rect x="930" y="430" rx="10" width="190" height="52" fill="#fff" stroke="#0f766e" stroke-width="2"/><text x="968" y="463" font-family="Arial" font-weight="700" font-size="17" fill="#0f766e">Accessibility</text>
  <rect x="70" y="600" rx="12" width="1060" height="55" fill="#fff"/><text x="110" y="635" font-family="Arial" font-weight="700" font-size="17" fill="#15333a">Same-week appointments</text><text x="440" y="635" font-family="Arial" font-weight="700" font-size="17" fill="#15333a">Bilingual support</text><text x="745" y="635" font-family="Arial" font-weight="700" font-size="17" fill="#15333a">Wheelchair accessible</text>
</svg>
