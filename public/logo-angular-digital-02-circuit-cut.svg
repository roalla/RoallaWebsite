<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" role="img" aria-labelledby="title desc">
  <title id="title">Roalla angular digital mark — circuit cut</title>
  <desc id="desc">The angular butterfly and pyramid mark with simple circuit-like channels cut from the wings.</desc>

  <defs>
    <mask id="wing-cuts">
      <rect width="1000" height="880" fill="#fff"/>
      <!-- One bold trace per wing, mirrored for precision. -->
      <path fill="#000" d="M230 280h116v24h-92v86h-24z"/>
      <path fill="#000" d="M770 280H654v24h92v86h24z"/>
      <rect x="218" y="378" width="48" height="48" rx="4" fill="#000"/>
      <rect x="734" y="378" width="48" height="48" rx="4" fill="#000"/>
    </mask>
  </defs>

  <g fill="#00B4C5">
    <g mask="url(#wing-cuts)">
      <path d="M454 222 86 116l168 410 174-83z"/>
      <path d="m546 222 368-106-168 410-174-83z"/>
    </g>
    <path d="m428 478-168 82 119 196 89-211z"/>
    <path d="m572 478 168 82-119 196-89-211z"/>
    <path d="M500 188 698 756h-92L500 449 394 756h-92z"/>
  </g>
</svg>
